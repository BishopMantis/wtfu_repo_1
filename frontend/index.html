:root{
  --green:#7CE117; --blue:#0024FD; --yellow:#FFF200;
  --purple:#9C49D1; --pink:#F63EDA; --black:#000; --white:#F9FAFA;
  --paper:#F1F2F3; --paper-2:#E5E7E8;
  --ink:#000; --ink-2:rgba(0,0,0,.62); --ink-3:rgba(0,0,0,.42); --ink-4:rgba(0,0,0,.26);
  --display:"Kaneda Gothic",Impact,sans-serif;
  --body:"Garet",-apple-system,sans-serif;
  --mono:"Courier Prime",monospace;           /* real brand font */
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.5,1);
  /* accent stays green across every round — no longer shifts color
     per round (used to go blue for round 2, purple for round 3) */
  --accent:var(--green); --on-accent:#000; --tint:124,225,23;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{
  background:var(--paper-2); width:100%; height:100%;
  overflow:hidden; overscroll-behavior:none;
  position:fixed; inset:0;
}
html,body{ margin:0; padding:0; }
body{
  font-family:var(--body); color:var(--ink); background:var(--paper);
  width:100%; max-width:480px; margin:0 auto; height:100vh; height:100dvh;
  display:flex; flex-direction:column; overflow:hidden; overscroll-behavior:none; position:relative;
  padding-top:env(safe-area-inset-top); -webkit-font-smoothing:antialiased;
}
button{ font-family:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
.mono{ font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }

/* colour field behind everything — REMOVED per Connie's note (green
   cast over white read as unintentional, client could object). Divs
   stay in the DOM as harmless no-ops so this is a one-line revert
   if she wants any of it back. */
.canvas{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.canvas .wash{
  position:absolute; top:-30%; left:-25%; width:150%; height:62%;
  background:none;
}
.canvas .wash.low{ top:auto; bottom:-34%; height:54%; background:none; }

/* ---------- header ---------- */
.topbar{ position:relative; z-index:2; flex-shrink:0; padding:7px 14px 2px; }
.brandline{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
/* Real logo file now (Connie's wide horizontal lockup), not a
   recreation — embedded as a data URI so the file stays a single
   self-contained HTML page. */
.logo-mark{ height:26px; width:auto; display:block; }
.burst{
  font-family:var(--display); font-weight:900; font-size:9px;
  background:var(--black); color:var(--white); padding:3px 7px; border-radius:3px; letter-spacing:.06em;
}

/* ---------- countdown ---------- */
.clockbar{ position:relative; z-index:2; flex-shrink:0; padding:6px 14px 7px; }
.clockcard{
  position:relative; background:var(--black); border-radius:14px; padding:9px 16px 8px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  box-shadow:5px 5px 0 rgba(0,0,0,.14);
  overflow:hidden;
}
.ck-left{ position:relative; min-width:0; }
.ck-round{
  font-family:var(--display); font-weight:900; font-size:clamp(28px,9vw,38px); line-height:.95;
  color:var(--white); text-transform:uppercase; letter-spacing:-.02em;
}
.ck-round b{ color:var(--accent); transition:color .7s var(--ease); }
.ck-status{ font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-top:3px; }
.ck-right{ position:relative; text-align:right; flex-shrink:0; }
.ck-time{
  font-family:var(--display); font-weight:900; font-size:clamp(18px,6vw,26px); line-height:1;
  color:var(--accent); font-variant-numeric:tabular-nums; letter-spacing:-.02em;
  transition:color .7s var(--ease);
}
.ck-cap{ font-family:var(--mono); font-size:8px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.45); margin-top:3px; }
.clockcard.closing .ck-time{ color:var(--yellow); animation:blink 1s steps(1) infinite; }
.clockcard.locked .ck-time{ color:var(--white); }
@keyframes blink{ 50%{ opacity:.4; } }

/* ---------- section labels ---------- */
.section-label{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; }
.section-label .grp{ display:flex; align-items:center; gap:8px; min-width:0; }
.section-label .ttl{
  font-family:var(--display); font-weight:900; font-size:13px;
  text-transform:uppercase; letter-spacing:-.01em;
}
.section-label .aside{ font-family:var(--mono); font-size:8.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }
.live-tag{ display:flex; align-items:center; gap:4px; background:var(--pink); border-radius:99px; padding:2px 7px; }
.live-tag i{ width:5px; height:5px; border-radius:50%; background:#000; animation:pulseLive 1.4s ease-in-out infinite; }
@keyframes pulseLive{ 0%,100%{ opacity:1;} 50%{ opacity:.25;} }
.live-tag span{ font-family:var(--mono); font-size:8px; font-weight:700; color:#000; letter-spacing:.1em; }

/* ---------- leaderboard ---------- */
.board-wrap{ position:relative; z-index:2; flex-shrink:0; padding:0 14px 6px; }
.gallery-title{
  display:block; width:60%; background:var(--black); color:var(--white);
  font-family:var(--display); font-weight:900; font-size:20px; line-height:1.1;
  text-transform:uppercase; letter-spacing:-.01em; border-radius:12px;
  padding:10px 14px; margin:0 0 16px; box-shadow:5px 5px 0 rgba(0,0,0,.14);
}
.gallery-cta{
  display:inline-flex; align-items:center; gap:5px; background:var(--yellow); color:#000;
  border:2px solid var(--black); border-radius:20px; padding:6px 12px 5px;
  box-shadow:3px 3px 0 var(--black); font-family:var(--display); font-weight:900;
  font-size:9.5px; letter-spacing:.02em; text-transform:uppercase; cursor:pointer;
  transition:transform .13s ease, box-shadow .13s ease;
}
.gallery-cta:active{ transform:translate(3px,3px); box-shadow:0 0 0 var(--black); }
.leaderboard-row{ display:flex; justify-content:center; align-items:flex-end; gap:22px; }
.lb-chip{ min-width:0; display:flex; flex-direction:column; align-items:center; gap:4px; width:64px; }
.lb-av{
  position:relative; width:100%; max-width:58px; aspect-ratio:1/1; border-radius:50%;
  border:2px solid var(--black); background:var(--paper-2);
}
.lb-av .clip{ position:absolute; inset:0; border-radius:50%; overflow:hidden; }
.lb-av img{ width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .5s ease; }
.lb-av img.in{ opacity:1; }
.lb-av .rank{
  position:absolute; top:-8px; right:-8px; min-width:25px; height:21px; border-radius:11px;
  display:flex; align-items:baseline; justify-content:center; gap:1px; padding:0 5px;
  border:2px solid var(--black); color:#000;
}
.lb-av .rank .rk-main{ font-family:var(--display); font-weight:900; font-size:12px; line-height:1; }
.lb-av .rank .rk-suf{ font-family:var(--display); font-weight:900; font-size:6px; line-height:1; }
.lb-av .star{
  position:absolute; bottom:-3px; right:-3px; width:15px; height:15px; border-radius:50%;
  background:var(--accent); color:var(--on-accent); font-size:7px; border:2px solid var(--black);
  display:flex; align-items:center; justify-content:center; transition:background .7s var(--ease);
}
.lb-chip.me .lb-av{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(var(--tint),.35); }
/* medal rings — gold is the thickest / most glow, bronze the least,
   so first place visibly outranks second, second outranks third.
   Comes after .me so a top-3 "you" still shows the medal, not just
   the generic accent ring — the star badge already marks "this is you". */
.lb-chip.r1 .lb-av{ border-width:3px; border-color:var(--green); box-shadow:0 0 0 3px rgba(124,225,23,.4), 0 0 16px 2px rgba(124,225,23,.55); }
.lb-chip.r2 .lb-av{ border-width:2.5px; border-color:var(--yellow); box-shadow:0 0 0 2px rgba(255,242,0,.4), 0 0 10px 1px rgba(255,242,0,.45); }
.lb-chip.r3 .lb-av{ border-width:2px; border-color:var(--pink); box-shadow:0 0 0 2px rgba(246,62,218,.35), 0 0 7px rgba(246,62,218,.35); }
.lb-name{ font-size:10px; font-weight:600; color:var(--ink-2); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lb-chip.me .lb-name{ color:var(--ink); font-weight:700; }
.lb-score{ font-family:var(--display); font-weight:900; font-size:15px; line-height:1; }

.you-row{ display:flex; align-items:center; gap:9px; margin-top:8px; }
.you-row .you-chip{ display:flex; flex-direction:column; align-items:center; gap:1px; flex-shrink:0; }
.you-row .you-chip .lb-av{ max-width:30px; }
.you-row .you-chip .you-label{ font-family:var(--mono); font-size:7px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); }
.you-row .you-score{ font-family:var(--display); font-weight:900; font-size:17px; line-height:1; }
.see-all-btn{
  margin-left:auto; flex-shrink:0; background:none; border:1px solid var(--ink-4); border-radius:10px;
  padding:8px 12px; font-family:var(--mono); font-size:8.5px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); cursor:pointer;
}

/* ---------- point buttons ---------- */
.bucket-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
.bucket{
  position:relative; overflow:hidden; cursor:pointer; min-width:0; text-align:left;
  border:2px solid var(--black); border-radius:13px; background:var(--white);
  padding:11px 10px 10px; box-shadow:3px 3px 0 var(--black);
  transition:transform .13s ease, box-shadow .13s ease, background .5s var(--ease);
}
.bucket:active{ transform:translate(3px,3px); box-shadow:0 0 0 var(--black); }
.bucket .motion{ display:flex; flex-direction:column; align-items:flex-start; width:100%; }
.pt-chip{
  display:flex; flex-direction:column; align-items:flex-start;
  background:var(--white); border:1.5px solid var(--black); border-radius:8px;

}
.bucket .val{

  letter-spacing:.01em; font-variant-numeric:tabular-nums; color:var(--ink);
}
.bucket .unit{ font-family:var(--mono); font-size:7px; font-weight:700; color:var(--ink-3); letter-spacing:.1em; text-transform:uppercase; margin-top:1px; }
/* tiny fanned stack — a real preview of what's inside, not an icon */
.mini-stack{ position:relative; width:100%; height:38px; margin-bottom:7px; }
.mini-card{
  position:absolute; left:1%; width:98%; box-sizing:border-box;
  background:var(--paper); border:1px solid rgba(0,0,0,.45); border-radius:5px;
  font-family:var(--mono); font-size:7px; font-weight:600; color:var(--ink-2); line-height:1.3;
  padding:3px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  box-shadow:1px 1px 0 rgba(0,0,0,.2);
}
.mini-card.mc1{ top:0;   transform:rotate(-3deg);  z-index:3; }
.mini-card.mc2{ top:11px;transform:rotate(2.5deg); z-index:2; }
.mini-card.mc3{ top:22px;transform:rotate(-2deg);  z-index:1; opacity:.82; }
.bucket .avail{ font-size:9.5px; font-weight:600; color:var(--ink-3); }
.bucket .avail.scarce{ color:var(--white); font-weight:700; background:var(--black); padding:1px 5px; border-radius:3px; }
.bucket .fill{ position:absolute; left:0; bottom:0; height:4px; background:var(--black); transition:width .6s var(--ease); }
/* Fixed per-difficulty colour, independent of round — 10/15/20 are
   the easy tier, 25/30/35 medium, 40/45/50 hard. Unlike the round
   accent elsewhere, these don't shift when the round changes;
   they're telling you the prompt's difficulty, not the time of day. */
.bucket.tier-easy{ background:var(--green); }
.bucket.tier-medium{ background:var(--yellow); }
.bucket.tier-hard{ background:var(--pink); }
.bucket.cleared{ opacity:.4; box-shadow:none; transform:none; }

/* locked state between rounds */
.locked-panel{
  border:2px dashed var(--black); border-radius:14px; background:var(--white);
  padding:26px 18px; text-align:center;
}
.locked-panel .lk{ font-size:30px; }
.locked-panel h3{
  font-family:var(--display); font-weight:900; font-size:19px;
  text-transform:uppercase; margin:8px 0 6px; letter-spacing:-.02em;
}
.locked-panel p{ font-size:12.5px; line-height:1.5; color:var(--ink-2); margin:0; }

/* ---------- prompt rows ---------- */
.card-list{ display:flex; flex-direction:column; gap:7px; }
.pcard{
  cursor:pointer;
  border:2px solid var(--black); border-radius:13px; background:var(--white);
  padding:11px 12px; box-shadow:3px 3px 0 var(--black);
  transition:transform .13s ease, box-shadow .13s ease;
}
.pcard:active{ transform:translate(3px,3px); box-shadow:0 0 0 var(--black); }
.pcard .motion{ display:flex; gap:11px; align-items:flex-start; width:100%; }
.pcard .pts{ font-family:var(--display); font-weight:900; font-size:27px; min-width:34px; line-height:.92; letter-spacing:.02em; }
.pcard .text{ font-family:var(--display); font-weight:900; font-size:12.5px; line-height:1.4; }
.pcard .meta{ font-family:var(--mono); font-size:8.5px; font-weight:700; color:var(--ink-3); margin-top:6px; text-transform:uppercase; letter-spacing:.08em; }
.pcard.done{ opacity:.42; box-shadow:none; }
.pcard.done .text{ text-decoration:line-through; }
.pcard .tick{ font-size:13px; }

/* ---------- idle energy ----------------------------------------
   Arcade-cabinet idle: each card sits still for most of its cycle,
   then jolts, so the grid reads as holding energy rather than
   waiting. Period and phase offset are randomised per card in
   stagger(), so nothing ever pulses in unison.

   This now animates a plain `transform` on an inner .motion
   wrapper — a separate element from the outer .pcard/.bucket that
   owns the :active press-transform. Two different elements, two
   ordinary `transform` animations, no fighting between them, and
   no dependency on the newer individual translate/rotate
   properties some mobile browsers render inconsistently when
   combined with a second transform-based animation on the same
   element (which is what made this shake invisible on mobile
   Chrome before, while working fine on desktop). */
@keyframes idleTwitch{
  0%,84%,100%{ transform:translate(0,0)        rotate(0deg);   }
  86%  { transform:translate(-1.5px,.5px)  rotate(-.55deg); }
  88.5%{ transform:translate(1.5px,-1px)   rotate(.5deg);   }
  91%  { transform:translate(-1px,.5px)    rotate(-.3deg);  }
  93.5%{ transform:translate(.5px,-.5px)   rotate(.15deg);  }
  96%  { transform:translate(0,0)          rotate(0deg);    }
}
.motion{ animation:riseIn .38s var(--ease) both; animation-delay:var(--d,0ms); }
.motion.idle{
  animation:riseIn .38s var(--ease) both, idleTwitch var(--tw,9s) linear infinite;
  animation-delay:var(--d,0ms), var(--td,0s);
}
/* spent cards are inert — no charge left in them */
.pcard.done .motion.idle,.bucket.cleared .motion.idle{ animation:riseIn .38s var(--ease) both; animation-delay:var(--d,0ms); }


/* ---------- podium sparkle ----------
   Ranks 1–3 twinkle, 1st hardest: 3 sparks / 2 / 1, and the
   higher the rank the faster and larger the cycle. Four-point
   stars built from two crossed bars — cleaner than a glyph at
   7px, and it takes the rank colour. */
@keyframes twinkle{
  0%,70%,100%{ opacity:0; scale:.25; rotate:0deg; }
  79%        { opacity:1; scale:1;   rotate:45deg; }
  88%        { opacity:.2; scale:.6; rotate:75deg; }
}
.lb-av .sparks{ position:absolute; inset:-6px; pointer-events:none; z-index:5; }
.lb-av .sparks i{
  position:absolute; width:var(--ss,7px); height:var(--ss,7px); opacity:0;
  background:
    linear-gradient(to right, transparent 45%, var(--spark,var(--yellow)) 45%, var(--spark,var(--yellow)) 55%, transparent 55%),
    linear-gradient(to bottom, transparent 45%, var(--spark,var(--yellow)) 45%, var(--spark,var(--yellow)) 55%, transparent 55%);
  animation:twinkle var(--sp,2.6s) var(--ease) infinite;
}
.lb-av .sparks i:nth-child(1){ top:-1px;   right:2px;  animation-delay:0s; }
.lb-av .sparks i:nth-child(2){ bottom:1px; left:-1px;  animation-delay:.55s; }
.lb-av .sparks i:nth-child(3){ top:6px;    left:-3px;  animation-delay:1.1s; }
.lb-chip.r1 .sparks{ --spark:var(--yellow); --sp:1.7s; --ss:9px; }
.lb-chip.r2 .sparks{ --spark:var(--black);  --sp:2.4s; --ss:7px; }
.lb-chip.r3 .sparks{ --spark:var(--pink);   --sp:3.2s; --ss:6px; }

@media (prefers-reduced-motion:reduce){
  .lb-av .sparks i{ animation:none; opacity:.85; scale:.8; rotate:45deg; }
}

/* ---------- live feed ---------- */

.post .media{ position:relative; aspect-ratio:4/3; background:var(--paper-2); overflow:hidden; }

/* ---------- sheet ---------- */
.overlay{

  opacity:0; pointer-events:none; transition:opacity .24s var(--ease);
}
.overlay.open{ opacity:1; pointer-events:auto; }
.sheet{

}

  box-shadow:2px 2px 0 var(--black);
}

.sheet-body::-webkit-scrollbar{ display:none; }
.cd-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:13px; }
.cd-headline{ display:flex; align-items:flex-end; gap:10px; margin-bottom:9px; }

  letter-spacing:-.01em; -webkit-text-stroke:1.5px #000;
}

.sheet-close{
  width:32px; height:32px; border-radius:50%; flex-shrink:0; cursor:pointer;
  background:var(--black); border:none; color:var(--white); font-size:16px;
  display:flex; align-items:center; justify-content:center; transition:transform .16s var(--spring);
}
.sheet-close:active{ transform:scale(.88); }
.flagnote{ font-family:var(--mono); font-size:10px; line-height:1.5; margin-top:10px; background:var(--yellow); padding:6px 8px; border-radius:4px; font-weight:700; }
.seg{ display:flex; gap:5px; background:var(--paper-2); border:2px solid var(--black); border-radius:12px; padding:4px; margin:15px 0 13px; }
.seg button{
  flex:1; padding:9px 4px; border-radius:8px; border:none; cursor:default; background:transparent;
  color:var(--ink-4); font-family:var(--display); font-weight:800; font-size:12px;
  text-transform:uppercase; transition:all .2s ease;
}
.seg button.on{ background:var(--black); color:var(--white); }
/* Two real buttons instead of one ambiguous drop-zone. "Take a
   Photo/Video" carries the `capture` attribute, which is the part
   that actually matters — it's what tells the phone to open the
   camera directly instead of falling back to whatever the browser
   feels like defaulting to (usually the gallery). "From Gallery"
   is a plain, capture-less file input, so it always goes to the
   photo/video library. Two honest buttons, no ambiguity. */
.capture-row{ display:flex; gap:8px; margin-bottom:8px; }
.capture-btn{
  flex:1; min-width:0; height:84px; border:2px solid var(--black); border-radius:14px;
  background:var(--white); cursor:pointer; display:flex; flex-direction:column;

.capture-btn .cb-label{

  text-align:center; line-height:1.15;
}

.capture-btn.picked .cb-label{ color:var(--on-accent); }
.capture-status{
  font-family:var(--mono); font-size:10px; font-weight:700; color:var(--ink-3);
  text-align:center; margin-bottom:13px; min-height:14px; letter-spacing:.03em;
}
.capture-status.ready{ color:var(--accent); }
textarea{
  width:100%; min-height:112px; padding:12px 14px; border-radius:12px; resize:none; margin-bottom:13px;
  background:var(--white); border:2px solid var(--black); color:var(--ink);
  font-family:var(--body); font-size:14px; line-height:1.55; outline:none;
}

.action-btn{
  width:100%; padding:15px; border:2px solid var(--black); border-radius:12px; cursor:pointer;
  font-family:var(--display); font-weight:900; font-size:17px;
  letter-spacing:.02em; text-transform:uppercase;
  background:var(--accent); color:var(--on-accent); box-shadow:4px 4px 0 var(--black);
  transition:transform .13s ease, box-shadow .13s ease;
}
.action-btn:active{ transform:translate(4px,4px); box-shadow:0 0 0 var(--black); }
.action-btn.undo{ background:var(--white); color:var(--ink); }
.status-line{ font-family:var(--display); font-weight:900; font-size:16px; text-transform:uppercase; margin:14px 0 11px; }

.toast{
  position:fixed; left:50%; bottom:74px; transform:translateX(-50%) translateY(12px);
  background:var(--black); color:var(--white); font-size:12px; font-weight:600;
  padding:11px 18px; border-radius:99px; z-index:90; max-width:88%; text-align:center;
  opacity:0; animation:toastIn .38s var(--spring) forwards;
}

.toast.out{ animation:toastOut .28s var(--ease) forwards; }
@keyframes toastOut{ to{ opacity:0; transform:translateX(-50%) translateY(10px);} }

.celebrate{ position:fixed; inset:0; z-index:95; pointer-events:none; display:flex; align-items:center; justify-content:center; }
.celebrate .stack{ text-align:center; animation:pop .45s var(--ease) both; }
@keyframes pop{ 0%{ opacity:0; transform:scale(.8) rotate(-5deg);} 65%{ transform:scale(1.05) rotate(1deg);} 100%{ opacity:1; transform:scale(1);} }
.celebrate .big{
  font-family:var(--display); font-weight:900; font-size:92px; line-height:.9;
  color:var(--accent); -webkit-text-stroke:3px #000; letter-spacing:-.05em;
}
.celebrate .cap{
  font-family:var(--display); font-weight:900; font-size:20px;
  text-transform:uppercase; background:var(--black); color:var(--white);
  display:inline-block; padding:4px 12px; border-radius:4px; margin-top:4px;
}

.celebrate.fade{ animation:fadeOut .45s var(--ease) forwards; }
@keyframes fadeOut{ to{ opacity:0; transform:scale(.96);} }
.confetti{ position:absolute; top:50%; left:50%; animation:confettiBurst 1.15s var(--ease) forwards; }
@keyframes confettiBurst{
  0%{ opacity:1; transform:translate(0,0) rotate(0) scale(1);}
  100%{ opacity:0; transform:var(--tx) rotate(var(--rot)) scale(.3);}
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
@media (max-height:700px){
  .ck-time{ font-size:27px; } .ck-round{ font-size:40px; }
  .bucket .val{ font-size:22px; }
  .mini-stack{ height:32px; }
  .mini-card.mc2{ top:10px; } .mini-card.mc3{ top:20px; }
}
/* Narrower phones give the 3-column bucket grid a narrower column
   than the desktop view has room for. The card's height was tuned
   to look right against the WIDER desktop column (width a touch
   more than height); left alone, that same height against a
   narrower column reads as a tall portrait card instead of the
   squarish/wide rectangle Connie wants everywhere. Trim the fixed-
   height parts (chip, mini-stack, padding) so total card height
   drops in step with the narrower column, keeping the proportions
   roughly consistent across screen sizes rather than just on desktop. */
@media (max-width:430px){
  .bucket{ padding:8px 8px 7px; }
  .pt-chip{ padding:3px 6px 3px; margin-bottom:5px; }
  .bucket .val{ font-size:21px; }
  .mini-stack{ height:27px; margin-bottom:5px; }
  .mini-card{ font-size:6.5px; padding:2px 4px; }
  .mini-card.mc2{ top:8px; } .mini-card.mc3{ top:16px; }
  .bucket .avail{ font-size:9px; }
}

/* ---------- lightbox: full-screen playback for real uploads ---------- */
.lightbox{
  position:fixed; inset:0; z-index:120; background:rgba(0,0,0,.92);
  display:flex; align-items:center; justify-content:center; padding:24px;
  animation:lbIn .2s var(--ease);
}
@keyframes lbIn{ from{ opacity:0;} to{ opacity:1;} }
.lightbox img, .lightbox video{
  max-width:100%; max-height:100%; border-radius:12px; border:2px solid #fff;
}
.lb-close{
  position:absolute; top:18px; right:18px; width:38px; height:38px; border-radius:50%;
  background:#fff; color:#000; border:none; font-size:19px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}

/* ---------- follow-gate: shown once before the game ---------- */
.gate{
  position:fixed; inset:0; z-index:130; background:rgba(0,0,0,.7); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; padding:22px;
  animation:lbIn .25s var(--ease);
}
.gate.closing{ animation:fadeOut .3s var(--ease) forwards; }
.gate-card{
  background:var(--paper); border:3px solid var(--black); border-radius:20px;
  max-width:340px; width:100%; box-shadow:8px 8px 0 var(--black);
  text-align:center; max-height:86vh; display:flex; flex-direction:column;
}
.gate-card-scroll{
  overflow-y:auto; flex:1; padding:26px 22px 0; min-width:0;
}
.gate-card-actions{
  padding:14px 22px 22px; flex-shrink:0; border-top:2px solid var(--black);
}
.gate-mark{ margin-bottom:14px; }
.gate-mark img{ height:30px; width:auto; display:inline-block; }
.gate-card h2{
  font-family:var(--display); font-weight:900; font-size:21px;
  text-transform:uppercase; margin:0 0 8px; letter-spacing:-.02em;
}
.gate-card p{ font-size:12.5px; line-height:1.5; color:var(--ink-2); margin:0 0 16px; }
.gate-socials{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
.gate-btn{
  display:flex; justify-content:space-between; align-items:center; text-decoration:none; color:var(--ink);
  border:2px solid var(--black); border-radius:11px; padding:11px 14px; font-weight:600; font-size:13px;
  background:var(--white); transition:transform .13s ease;
  width:100%; font-family:inherit; cursor:pointer; -webkit-appearance:none;
}
.gate-btn:active{ transform:scale(.97); }
.gate-handle{ font-family:var(--mono); font-size:10.5px; color:var(--ink-3); }
/* ---------- avatar picker: icon grid + upload-instead option ---------- */
.icon-grid{
  display:grid; grid-template-columns:repeat(5,1fr); gap:6px;
  margin:6px 0 14px; padding:9px; background:rgba(0,0,0,.03); border-radius:12px;
}
.icon-token{
  aspect-ratio:1/1; border:2px solid var(--black); border-radius:9px; background:var(--white);
  display:flex; align-items:center; justify-content:center; cursor:pointer; padding:3px;
  transition:transform .12s ease, box-shadow .12s ease; -webkit-appearance:none;
}
.icon-token svg{ display:block; width:70%; height:70%; }
.icon-token:active{ transform:scale(.9); }
.icon-token.picked{ box-shadow:0 0 0 3px var(--green); border-color:var(--green); }
.icon-token.taken{ opacity:.22; cursor:not-allowed; background:#e8e8e8; }
.avatar-photo-row{ margin-bottom:14px; }
.avatar-photo-row .gate-handle{ font-size:9.5px; }
.icon-fill{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:var(--white); }
.gate-form{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
.gate-row{ display:flex; gap:8px; }
.gate-input{
  flex:1; min-width:0; border:2px solid var(--black); border-radius:11px;
  padding:11px 13px; font-family:var(--body); font-size:13px; font-weight:500;
  background:var(--white); color:var(--ink); outline:none; text-align:left;
}
.gate-input::placeholder{ color:var(--ink-4); }
.gate-input.err{ border-color:#C24634; }
</style>
</head>
<body data-round="1">

<div class="canvas"><div class="wash"></div><div class="wash low"></div></div>

<div class="topbar">
  <div class="brandline">
    <img class="logo-mark" id="headerLogo" alt="Wake The F Up">
    <div class="burst">Scavenger Hunt</div>
  </div>
</div>

<div class="clockbar">
  <div class="clockcard" id="clockCard">
    <div class="ck-left">
      <div class="ck-round" id="ckRound">Round <b>1</b></div>
      <div class="ck-status" id="ckStatus">Wellness</div>
    </div>
    <div class="ck-right">
      <div class="ck-time" id="ckTime">0:00:00</div>
      <div class="ck-cap" id="ckCap">until round ends</div>
    </div>
  </div>
</div>

<div class="board-wrap">
  <div class="section-label">
    <span class="grp"><span class="ttl">Who's winning</span></span>
    <span class="aside" id="boardAside">Top 3 win</span>
  </div>
  <div class="leaderboard-row" id="leaderboard"></div>
  <div class="you-row" id="youRow"></div>
</div>

<div class="pane-header">
  <span class="pane-title" id="paneTitle">Pick your points</span>
  <span class="pane-count" id="paneCount"></span>
</div>

<div class="scroll" id="scrollPane"></div>

<footer class="nav">
  <span class="fl" id="demoHandle">WTFU</span>
  <button type="button" class="toggle-chip" onclick="endGameTest()">End Game Test</button>
  <button class="reset" onclick="resetDemo()">Reset</button>
</footer>

<div class="overlay" id="cardSheet" onclick="if(event.target===this) closeSheet('cardSheet')">
  <div class="sheet">
    <div class="grabber"></div>
    <button type="button" class="sheet-close" onclick="closeSheet('cardSheet')">✕</button>
    <div class="sheet-body" id="cdBody"></div>
  </div>
</div>

<div class="overlay" id="gallerySheet" onclick="if(event.target===this) closeSheet('gallerySheet')">
  <div class="sheet">
    <div class="grabber"></div>
    <button type="button" class="sheet-close" onclick="closeSheet('gallerySheet')">✕</button>
    <div class="sheet-body" id="galleryBody"></div>
  </div>
</div>

<div class="overlay" id="playersSheet" onclick="if(event.target===this) closeSheet('playersSheet')">
  <div class="sheet">
    <div class="grabber"></div>
    <button type="button" class="sheet-close" onclick="closeSheet('playersSheet')">✕</button>
    <div class="sheet-body" id="playersBody"></div>
  </div>
</div>

/* ============================================================
   ROUND LOGIC (Connie's latest notes)
   · Rounds are 2 hours. Only the live round is ever visible.
   · No score box; your total lives in the leaderboard.
   · No point threshold — top 3 on the board when the clock
     hits zero win the round. Tie-break: whoever reached the
     score first (recorded per submission).
   · Between rounds the game LOCKS so nothing can be posted
     into the wrong round.

   ROUND TIMES — CONFIRM WITH CONNIE
   Her note said "maybe two hours". Set to 2h here, keeping the
   11 / 3 / 7 start times from the locked docs. Change the two
   numbers per round below and everything follows.
   ============================================================ */

const ROUND_WINDOWS = {
  1:{ start:12*60, end:14*60, name:""   },  // noon – 2pm
  2:{ start:17*60, end:19*60, name:""   }   // 5pm – 7pm
};
/* single source of truth for "how many rounds" — everything below
   reads this instead of hardcoding [1,2,3], so changing round count
   again means editing ROUND_WINDOWS only, not five different arrays */
const ROUND_IDS = Object.keys(ROUND_WINDOWS).map(Number);

/* shared brand-color rank badges — used by both the top-3 podium
   and the full "all players" list so they match exactly */
const MEDAL_HEX = {1:"var(--green)", 2:"var(--yellow)", 3:"var(--pink)"};
const ordinalSuffix = (n) => (n === 1 ? "ST" : n === 2 ? "ND" : n === 3 ? "RD" : "TH");
function rankChip(p, rank){
  return `<div class="lb-chip ${p.me ? 'me' : ''} ${rank <= 3 ? 'prize r' + rank : ''}">
    <span class="lb-av">
      <span class="clip">${renderAvatarClip(p)}</span>
      ${rank <= 3 ? `<span class="sparks">${'<i></i>'.repeat(4 - rank)}</span>` : ``}
      <span class="rank" style="background:${MEDAL_HEX[rank] || '#e5e5e5'}"><span class="rk-main">${rank}</span><span class="rk-suf">${ordinalSuffix(rank)}</span></span>
      ${p.me ? `<span class="star">★</span>` : ``}
    </span>
    <span class="lb-name">${p.i}</span>
    <span class="lb-score">${p.s}</span>
  </div>`;
}

function avatarClipFromString(avatarStr){
  if (!avatarStr) return `<img src="${face(5)}" alt="">`;
  if (avatarStr.startsWith("photo:")) {
    return `<img src="${API_BASE}/api/media/${avatarStr.slice(6)}" alt="" class="in">`;
  }
  const [shape, color] = avatarStr.split(":");
  if (!SHAPES[shape]) return `<img src="${face(5)}" alt="">`;
  const hex = (AVATAR_COLORS.find(c => c.id === color) || {}).hex || "#7CE117";
  return `<span class="icon-fill in">${avatarSVG(shape, hex, 40)}</span>`;
}

/* cumulative score across every round — the per-round caches above
   are what "who's winning right now, this round" is built from, but
   the actual end-of-game winner needs a real total, not just
   whatever round happened to be active last. Polled continuously
   (not just at game-end) so it's already warm by the time the game
   actually ends. */
let overallLeaderboardCache = [];
async function refreshOverallLeaderboard(){
  try {
    const res = await fetch(API_BASE + "/api/leaderboard");
    if (!res.ok) return;
    const data = await res.json();
    overallLeaderboardCache = data.leaderboard || [];
    if (phase === "done") renderPane();
  } catch(e){ /* best-effort — keep showing whatever we had */ }
}

function overallBoard(){
  const mockTotals = {};
  if (SHOW_PLACEHOLDERS) {
    ROUND_IDS.forEach(r => (MOCK[r] || []).forEach(p => {
      mockTotals[p.i] = mockTotals[p.i] || { i:p.i, s:0, a:p.a };
      mockTotals[p.i].s += p.s;
    }));
  }
  const realRows = overallLeaderboardCache
    .filter(r => r.id !== myPlayerId)
    .map(r => ({ i:(r.name || "Player").split(" ")[0], s:r.score, real:true, avatarStr:r.avatar, lastAt:r.last_at }));
  const myTotal = ROUND_IDS.reduce((sum, r) => sum + roundScore(r), 0);
  return [...Object.values(mockTotals), ...realRows, {i:"You", s:myTotal, me:true, a:5, lastAt:myLastSubmissionAt}]
    .sort((a,b) => (b.s - a.s) || ((a.lastAt ?? Infinity) - (b.lastAt ?? Infinity)));
}

/* turns a raw /api/feed row (from any player, any device) into the
   same post shape postHTML() already knows how to render, so the
   real feed and the local demo/own-submission feed share one
   rendering path */
function rowToPost(row){
  const prompt = PROMPTS.find(p => p.id === row.prompt_id);
  const isText = prompt ? prompt.proof === "text" : (!row.media_url);
  const isVideo = prompt ? prompt.proof === "video" : false;
  const mine = row.player_id === myPlayerId;
  return mk({
    who: mine ? "You" : (row.name || "Player").split(" ")[0],
    mine,
    kind: isText ? "text" : (isVideo ? "video" : "photo"),
    quote: isText ? (row.text_answer || "(no answer saved)") : undefined,
    src: !isText ? row.media_url : undefined,
    cap: prompt ? (prompt.text.length > 40 ? prompt.text.slice(0,40) + "…" : prompt.text) : undefined,
    ts: "",
    real: true
  });
}
function feedItemFromReal(row){
  if (row.player_id === myPlayerId) return null;  // your own posts already render instantly from local state
  return rowToPost(row);
}

   past rounds" view. Pulls fresh every time it's opened rather

  body.innerHTML = `<h2 class="gallery-title">Full gallery</h2><div class="mono" style="text-align:center;padding:26px 0">Loading…</div>`;

function renderGallery(rows){
  const body = document.getElementById('galleryBody');
  const byRound = Object.fromEntries(ROUND_IDS.map(r => [r, []]));
  rows.forEach(row => { if (byRound[row.round]) byRound[row.round].push(row); });

  const sections = ROUND_IDS.map(r => {
    const items = byRound[r].map(rowToPost);
    const label = ROUND_WINDOWS[r].name ? `Round ${r} · ${ROUND_WINDOWS[r].name}` : `Round ${r}`;
    return `
      <div class="section-label" style="margin-top:28px">
        <span class="grp"><span class="ttl">${label}</span></span>
        <span class="aside">${items.length} post${items.length === 1 ? "" : "s"}</span>
      </div>
      ${items.length
        ? `<div class="feed-grid">${items.map(postHTML).join("")}</div>`
        : `<div class="mono" style="padding:6px 0 26px">Nothing posted yet</div>`}`;
  }).join("");

  body.innerHTML = `<h2 class="gallery-title">Full gallery</h2>` + sections;
}

function loadAvatar(){
  try {
    const raw = localStorage.getItem(AVATAR_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    /* a photo's actual bytes can't survive a reload — there's no
       real storage behind this prototype, just this browser tab's
       memory. If that's what was saved, fall back gracefully
       instead of pointing an <img> at a dead blob: URL. */
    if (parsed.type === "photo") return;
    myAvatar = parsed;
  } catch(e){}
}

  try { localStorage.setItem(AVATAR_KEY, JSON.stringify(a.type === "photo" ? {type:"photo"} : a)); } catch(e){}

function renderAvatarClip(p){
  if (p.real && !p.me) return avatarClipFromString(p.avatarStr);
  if (!p.me) return `<img src="${face(p.a)}" alt="" loading="lazy" onload="this.classList.add('in')" onerror="this.remove()">`;
  if (myAvatar && myAvatar.type === "photo" && myAvatar.src)
    return `<img src="${myAvatar.src}" alt="" class="in">`;
  if (myAvatar && myAvatar.type === "icon") {
    const hex = (AVATAR_COLORS.find(c => c.id === myAvatar.color) || {}).hex || "#7CE117";
    return `<span class="icon-fill in">${avatarSVG(myAvatar.shape, hex, 40)}</span>`;
  }
  return `<span class="icon-fill in">${avatarSVG("star", "#9C49D1", 40)}</span>`;
}

function eventState(mins){
  for (const r of ROUND_IDS) {
    const w = ROUND_WINDOWS[r];
    if (mins < w.start) return { phase:"break", round:r, target:w.start };
    if (mins < w.end)   return { phase:"live",  round:r, target:w.end };
  }
  return { phase:"done", round:ROUND_IDS[ROUND_IDS.length - 1], target:null };
}

/* DEMO_MODE runs the old fake clock (fixed start, jump-around
   checkpoints, good for walkthroughs). With it off, every device
   reads its own real clock — since ROUND_WINDOWS is already
   authored in real minutes-since-midnight, everyone's phone lands
   on the same round/phase/countdown automatically, no server
   round-trip or shared timestamp needed, just phones agreeing on
   what time it is. */
/* Always reads Pacific time, regardless of what timezone the
   visitor's phone happens to be set to — the event is anchored to
   California local time (PST/PDT, whichever is in effect on the
   actual date), not to each device's own clock setting. */
function currentClockReading(){
  if (DEMO_MODE) return { mins: simMinutes, secs: simSeconds };
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/Los_Angeles', hour12: false,
    hour: 'numeric', minute: 'numeric', second: 'numeric'
  }).formatToParts(new Date());
  const get = (t) => Number(parts.find((p) => p.type === t).value);
  let hour = get('hour');
  if (hour === 24) hour = 0;  // some engines report midnight as "24" with hour12:false
  return { mins: hour * 60 + get('minute'), secs: get('second') };
}

function fmt(secs){
  const h = Math.floor(secs/3600), m = Math.floor(secs%3600/60), s = secs%60;
  return h + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

function tickClock(){
  if (DEMO_MODE) {
    simSeconds++;
    if (simSeconds >= 60) { simSeconds = 0; simMinutes++; }
  }
  const { mins, secs } = currentClockReading();
  const st = eventState(mins);
  const changed = (st.phase !== phase) || (st.round !== activeRound);
  phase = st.phase; activeRound = st.round;
  document.body.dataset.round = activeRound;

  const card = document.getElementById('clockCard');
  if (phase === "done") {
    document.getElementById('ckRound').innerHTML = "That's a <b>wrap</b>";
    document.getElementById('ckStatus').textContent = "All rounds complete";
    document.getElementById('ckTime').textContent = "0:00:00";
    document.getElementById('ckCap').textContent = "game closed";
    card.classList.remove('closing'); card.classList.add('locked');
  } else {
    const secsLeft = Math.max((st.target - mins)*60 - secs, 0);
    document.getElementById('ckTime').textContent = fmt(secsLeft);
    if (phase === "live") {
      document.getElementById('ckRound').innerHTML = "Round <b>" + activeRound + "</b>";
      document.getElementById('ckStatus').textContent = ROUND_WINDOWS[activeRound].name;
      document.getElementById('ckCap').textContent = "until round ends";
      card.classList.toggle('closing', secsLeft <= 600);
      card.classList.remove('locked');
    } else {
      document.getElementById('ckRound').innerHTML = "Round <b>" + activeRound + "</b> next";
      document.getElementById('ckStatus').textContent = ROUND_WINDOWS[activeRound].name;
      document.getElementById('ckCap').textContent = "until doors open";
      card.classList.remove('closing'); card.classList.add('locked');
    }
  }

  if (changed) {
    view = { mode:"buckets", bucket:null };
    render();
    refreshRealLeaderboard(activeRound);
    refreshRealFeed(activeRound);
    if (phase === "live") toast("Round " + activeRound + " is live — all 33 prompts open, board back to zero");
    else if (phase === "break") toast("Round closed. Top 3 locked in — next round opens on the clock.");
    else if (phase === "done") { refreshOverallLeaderboard(); celebrateWinner(); }
  }
}

  {m:18*60,    t:"Mid Round 2"},
  {m:19*60+1,  t:"After the game"}
];
let cpIdx = 0, holdTimer = null;
/* Footer button — fast-forwards the demo clock to ~15s before the
   final round ends, then lets the real per-second countdown carry
   it the rest of the way so the actual "done" transition (and the
   winner celebration hooked to it) fires naturally, same as it
   would on the real clock. Demo-only, same as the checkpoint jumps. */
function endGameTest(){
  if (!DEMO_MODE) { toast("Demo mode is off — this only works during testing"); return; }
  haptic(15);
  const lastRound = ROUND_IDS[ROUND_IDS.length - 1];
  simMinutes = ROUND_WINDOWS[lastRound].end - 1;
  simSeconds = 45;
  const st = eventState(simMinutes);
  phase = st.phase; activeRound = st.round;
  document.body.dataset.round = activeRound;
  view = { mode:"buckets", bucket:null };
  render(); tickClock();
  toast("End-game test: ~15s left — watch the clock");
}

(function bindDemo(){
  const h = document.getElementById('demoHandle');
  const start = () => { if (!DEMO_MODE) return; holdTimer = setTimeout(() => {
    cpIdx = (cpIdx + 1) % CHECKPOINTS.length;
    simMinutes = CHECKPOINTS[cpIdx].m; simSeconds = 0;
    const st = eventState(simMinutes); phase = st.phase; activeRound = st.round;
    document.body.dataset.round = activeRound;
    view = { mode:"buckets", bucket:null };
    haptic(20); render(); tickClock(); toast("Demo: " + CHECKPOINTS[cpIdx].t);
  }, 600); };
  const stop = () => clearTimeout(holdTimer);
  h.addEventListener('pointerdown', start);
  ['pointerup','pointerleave','pointercancel'].forEach(e => h.addEventListener(e, stop));
})();

/* Same fix as the bucket/card navigation below: opening a sheet
   pushes a real history entry, so the phone's hardware/gesture back
   button closes the sheet instead of leaving the page entirely.
   closeSheet() routes through history.back() too (rather than just
   hiding the sheet directly) so the X button, tapping the backdrop,
   and the phone's back button all agree and never leave a stray
   history entry behind. */
function openSheet(id){
  haptic(8);
  history.pushState({ wtfuSheet: id }, "", location.href);
  document.getElementById(id).classList.add('open');
}
function closeSheet(id){
  if (history.state && history.state.wtfuSheet === id) history.back();
  else document.getElementById(id).classList.remove('open');
}

function toast(msg, ms=2800){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, ms);
}

   has the highest score SUMMED ACROSS ALL ROUNDS — the real overall

let selectedFile = null;   // the actual File object for the prompt sheet currently open

function openCard(id){
  if (phase !== "live") { toast("The round is closed — nothing can be posted right now."); return; }
  haptic(8);
  selectedFile = null;
  const p = PROMPTS.find(x => x.id === id);
  const isDone = R().done.includes(id);
  const types = SEGS[p.proof];

    `<button class="${types.includes(t) ? 'on' : ''}">${GLYPH[t]} ${t}</button>`).join("") + `</div>`;
  const input = isText
    ? `<textarea id="cdInput" placeholder="Type their answer here..." oninput="this.style.borderColor=''"></textarea>`
    : `<div class="capture-row">
         <button type="button" class="capture-btn" id="cdCaptureBtn" onclick="document.getElementById('cdCaptureInput').click()">
           <span class="cb-icon">${GLYPH[p.proof]}</span>

       </div>

       <input type="file" id="cdCaptureInput" accept="${p.proof === 'video' ? 'video/*' : 'image/*'}" capture="environment" style="display:none" onchange="fileChosen(this,'cdCaptureBtn')">
       <input type="file" id="cdUploadInput" accept="${p.proof === 'video' ? 'video/*' : 'image/*,video/*'}" style="display:none" onchange="fileChosen(this,'cdUploadBtn')">`;
  document.getElementById('cdBody').innerHTML = `
    <div class="cd-head">
      <div style="flex:1; padding-right:8px">
        <div class="cd-headline">
          <span class="cd-pts" style="color:${TIER_COLOR[p.cat]}">${p.pts}</span>
          <span><span class="mono" style="display:block;margin-bottom:2px">Points</span><span class="cd-cat">${p.cat}</span></span>
        </div>

      </div>
      <button class="sheet-close" onclick="closeSheet('cardSheet')">×</button>
    </div>
    ${isDone
      ? `<div class="status-line">✓ Done this round</div>
         <button class="action-btn undo" onclick="undo('${id}')">Undo — put it back</button>`
      : seg + input + `<button class="action-btn" onclick="submit('${id}')">Post it · ${p.pts} pts</button>`}
    <div class="mono" style="margin-top:13px">Sheet row ${p.id.slice(1)} · ${PLABEL[p.proof]}</div>`;

function fileChosen(input, btnId){
  if (input.files && input.files[0]) {
    selectedFile = input.files[0];
    document.querySelectorAll('.capture-btn').forEach(b => b.classList.remove('picked'));
    const btn = document.getElementById(btnId);
    if (btn) btn.classList.add('picked');
    const status = document.getElementById('cdCaptureStatus');
    if (status) {
      status.textContent = "Ready — " + selectedFile.name.slice(0, 30);
      status.classList.add('ready');
    }
    haptic(10);
  }
}

function submit(id){
  const p = PROMPTS.find(x => x.id === id);
  const isVid = p.proof === "video";
  const isText = p.proof === "text";
  const el = document.getElementById('cdInput');
  const typed = isText && el ? el.value.trim() : "";

  /* --- proof required: no empty submissions score points --- */
  if (isText && !typed) {
    haptic(30);
    if (el) { el.style.borderColor = "var(--alert, #C24634)"; el.focus(); }
    toast("Add an answer before you submit");
    return;
  }
  if (!isText && !selectedFile) {
    haptic(30);
    const status = document.getElementById('cdCaptureStatus');
    if (status) { status.style.color = "var(--alert, #C24634)"; }
    toast("Attach a " + PLABEL[p.proof].toLowerCase() + " before you submit");
    return;
  }

  /* --- re-check the round is still live: closes the gap where the
     clock rolls over while this sheet is open, so a submission can
     never land in the wrong round --- */
  const submittedRound = activeRound;
  if (phase !== "live") {
    closeSheet('cardSheet');
    toast("That round just ended — this one didn't get counted.");
    render();
    return;
  }

  /* real object URL so the feed shows exactly what was uploaded,
     and video posts are actually playable, not a placeholder */
  const realSrc = (!isText && selectedFile) ? URL.createObjectURL(selectedFile) : undefined;
  const fileToUpload = selectedFile;

  myLastSubmissionAt = Math.floor(Date.now() / 1000);
  rounds[submittedRound].done.push(id);
  rounds[submittedRound].feed.unshift(mk({
    who:"You", mine:true,
    kind: isText ? "text" : (isVid ? "video" : "photo"),
    dur: isVid ? "0:0" + (3 + Math.floor(Math.random()*6)) : undefined,
    quote: isText ? typed : undefined,
    src: realSrc,
    cap: p.text.length > 40 ? p.text.slice(0,40) + "…" : p.text,
    p:(rounds[submittedRound].done.length * 3) % PHOTOS.length,
    ts:"just now", promptId:id
  }));
  newUid = uid;
  selectedFile = null;
  closeSheet('cardSheet');
  haptic(18);
  celebrate(p.pts);
  saveProgress();

  /* sync to the live backend in the background — local score/UI
     already stand regardless of how this turns out, so a slow or
     dropped connection at the venue never blocks play */
  (async () => {
    try {
      let mediaUrl = null;
      if (!isText && fileToUpload) {
        const up = await apiUploadFile(fileToUpload);
        mediaUrl = up.url ? (API_BASE + up.url) : null;
      }
      await apiSubmit(id, submittedRound, p.pts, mediaUrl, isText ? typed : undefined);
      refreshRealLeaderboard(submittedRound);
      refreshRealFeed(submittedRound);
    } catch(e){ /* best-effort — local state already reflects the submission */ }
  })();

  /* per Connie's note: always return to the full point-value grid,
     never stay inside the bucket just submitted from */
  view = { mode:"buckets", bucket:null };
  render();
}

function undo(id){
  R().done = R().done.filter(x => x !== id);
  R().feed = R().feed.filter(f => f.promptId !== id);
  closeSheet('cardSheet');
  saveProgress();
  render();
}

function swap(fn){
  const pane = document.getElementById('scrollPane');
  pane.classList.add('leaving');
  setTimeout(() => { fn(); pane.classList.remove('leaving'); pane.scrollTop = 0; }, 130);
}

/* ============================================================
   BACK BUTTON — Connie's note

   Without this, the bucket grid → card list move was pure JS
   state with nothing pushed to browser history. The phone's own
   back button had nothing of ours to step back through, so it
   fell straight through to whatever page was open before this
   one — closing the game, not backing up a level inside it.

   Fix: every forward move here (open a bucket, "see all") pushes
   a real history entry. The phone's back button now fires a
   normal popstate event, which the listener below catches and
   uses to step the in-app view back — instead of the page
   actually navigating away. The "‹ All points" button goes
   through the exact same history.back() call, so there's one
   path to keep in sync, not two.

   Scoped deliberately to just this one navigation (grid ↔ list).
   Sheets (a prompt, the feed) keep their existing ✕/backdrop
   dismissal — folding modal state into the same history stack
   gets complicated fast (what should back do if a sheet is open
   on top of a bucket list?) and wasn't the specific problem
   reported. Worth a second pass later if it comes up.
   ============================================================ */
function openBucket(v){
  haptic(8);
  history.pushState({ wtfuView:"cards", bucket:v }, "", location.href);
  swap(() => { view = {mode:"cards", bucket:v}; renderPane(); });
}
function showAll(){
  haptic(8);
  history.pushState({ wtfuView:"cards", bucket:"all" }, "", location.href);
  swap(() => { view = {mode:"cards", bucket:"all"}; renderPane(); });
}
function backToBuckets(){
  /* let the popstate listener do the actual view change, so the
     hardware/gesture back button and this button can't disagree */
  history.back();
}
window.addEventListener("popstate", e => {
  const st = e.state;
  document.querySelectorAll('.overlay.open').forEach(o => {
    if (!st || st.wtfuSheet !== o.id) o.classList.remove('open');
  });
  if (st && st.wtfuSheet) {
    document.getElementById(st.wtfuSheet).classList.add('open');
    return;  // just a sheet open/close — the bucket/card pane underneath is untouched
  }
  if (st && st.wtfuView === "cards") {
    swap(() => { view = { mode:"cards", bucket: st.bucket }; renderPane(); });
  } else {
    swap(() => { view = { mode:"buckets", bucket:null }; renderPane(); });
  }
});

const POST_INDEX = {};   // uid -> post object, rebuilt every render so lightbox can look posts up

function postHTML(f){
  POST_INDEX[f.uid] = f;
  const real = !!f.src;   // true only for the player's own uploads in this browser session

  let media;
  if (f.kind === "text") {
    media = `<div class="quote"><span class="mark">\u201C</span><p>${f.quote}</p></div>`;
  } else if (f.kind === "video") {
    media = `<div class="media">
      <video src="${real ? f.src : ''}" ${real ? '' : 'style="display:none"'} muted playsinline preload="metadata"></video>
      ${!real ? `<img src="${img(f.p ?? 0, 300)}" alt="" loading="lazy" onload="this.classList.add('in')" onerror="this.remove()">` : ``}
      <span class="play"><i></i></span><span class="dur">${f.dur || "0:10"}</span>
    </div>`;
  } else {
    media = `<div class="media">
      <img src="${real ? f.src : img(f.p ?? 0, 300)}" alt="" loading="lazy" onload="this.classList.add('in')" onerror="this.remove()">
    </div>`;
  }

  const tapAttr = f.kind === "text" ? "" : `onclick="openLightbox(${f.uid})"`;
  return `<div class="post ${f.mine ? 'mine' : ''} ${f.uid === newUid ? 'just-in' : ''}" ${tapAttr}>
    <span class="kind-tag">${f.kind}</span>${media}
    <div class="cap"><span class="who">${f.who}</span><span class="sub">${f.ts}</span></div>
  </div>`;
}

/* Full-screen playback. Your own uploads are real files still held in
   this browser tab, so photo and video both play back exactly what
   was submitted. Other players' posts are demo/mock content with no
   real file behind them — video ones say so instead of faking a play
   that goes nowhere, which is what Connie ran into. */
function openLightbox(uid){
  const f = POST_INDEX[uid];
  if (!f) return;
  if (!f.src) {
    if (f.kind === "video") toast("Demo post — no real video attached. Your own uploads play back for real.");
    else openLightboxImg(img(f.p ?? 0, 900));
    return;
  }
  if (f.kind === "video") openLightboxVideo(f.src);
  else openLightboxImg(f.src);
}

function openLightboxImg(src){
  const wrap = document.createElement('div');
  wrap.className = 'lightbox';
  wrap.onclick = () => wrap.remove();
  wrap.innerHTML = `<button class="lb-close">×</button><img src="${src}" alt="">`;
  document.body.appendChild(wrap);
}
function openLightboxVideo(src){
  const wrap = document.createElement('div');
  wrap.className = 'lightbox';
  wrap.innerHTML = `<button class="lb-close" onclick="this.parentElement.remove()">×</button>
    <video src="${src}" controls autoplay playsinline></video>`;
  document.body.appendChild(wrap);
}

function render(){
  const score = roundScore(activeRound);
  /* a:5 is the spare portrait — keeps "You" from wearing J.M.'s face. */
  const realRows = (realLeaderboardCache[activeRound] || [])
    .filter(r => r.id !== myPlayerId)
    .map(r => ({ i:(r.name || "Player").split(" ")[0], s:r.score, real:true, avatarStr:r.avatar, lastAt:r.last_at }));
  const board = [...(SHOW_PLACEHOLDERS ? MOCK[activeRound] : []), ...realRows, {i:"You", s:score, me:true, a:5, lastAt:myLastSubmissionAt}]
    /* ties go to whoever reached that score first, not array order */
    .sort((a,b) => (b.s - a.s) || ((a.lastAt ?? Infinity) - (b.lastAt ?? Infinity)));
  currentBoard = board;  // full order, kept for the "See all players" sheet

  document.getElementById('leaderboard').innerHTML = board.slice(0, 3)
    .map((p, idx) => rankChip(p, idx + 1)).join("");

  const myRank = board.findIndex(p => p.me) + 1;
  const me = board.find(p => p.me);
  document.getElementById('youRow').innerHTML = `
    <span class="you-chip">
      <span class="lb-av"><span class="clip">${renderAvatarClip(me)}</span></span>
      <span class="you-label">You</span>
    </span>
    <span class="you-score">${me.s} <span class="mono" style="font-size:8.5px">#${myRank}</span></span>
    <button type="button" class="see-all-btn" onclick="openPlayers()">See all players →</button>`;

  document.getElementById('boardAside').textContent = phase === "live" ? "Top 3 win" : "Locked";

  renderPane();
}

function renderPane(){
  const pane = document.getElementById('scrollPane');
  const done = R().done;
  const title = document.getElementById('paneTitle');
  const count = document.getElementById('paneCount');
  const realFeedItems = (realFeedCache[activeRound] || []).map(feedItemFromReal).filter(Boolean);
  const feed = [...R().feed, ...realFeedItems, ...live];

  const feedBlock = `
    <div class="feed-section" id="feedSection">
      <div class="section-label">
        <span class="grp"><span class="ttl">Live feed</span>
          <span class="live-tag"><i></i><span>LIVE</span></span></span>
        <button type="button" class="gallery-cta" onclick="openGallery()">Full gallery →</button>
      </div>
      <div class="feed-grid">${feed.map(postHTML).join("")}</div>
    </div>`;

  /* between rounds / after the game: the game itself is locked */
  if (phase !== "live") {
    title.textContent = phase === "break" ? "Game locked" : "Game over";
    count.innerHTML = "";
    const winnersLine = phase === "done"
      ? (() => {
          const top3 = overallBoard().slice(0, 3).map(p => p.i);
          return top3.length
            ? `🏆 ${top3.join(", ")} — head to our booth to collect your prize!`
            : "Head to our booth to collect your prize!";
        })()
      : "";
    pane.innerHTML = `
      <div class="locked-panel">
        <div class="lk">${phase === "break" ? "⏳" : "🏁"}</div>
        <h3>${phase === "break" ? "Next round hasn't opened" : "That's the whole game"}</h3>
        <p>${phase === "break"
          ? "Nothing can be posted between rounds, so your points always land in the right one. The board resets the moment the clock starts."
          : winnersLine}</p>
      </div>` + feedBlock;
    newUid = null;
    return;
  }

  if (view.mode === "buckets") {
    title.textContent = "Pick your points";
    count.innerHTML = `<span>${done.length} / 33</span><button class="link-btn" onclick="showAll()">See all</button>`;
    pane.innerHTML = `<div class="bucket-grid">` + POINT_VALUES.map(v => {
      const inB = PROMPTS.filter(p => p.pts === v);
      const d = inB.filter(p => done.includes(p.id)).length;
      const left = inB.length - d;
      /* preview shows what's still playable first, filling with
         completed ones only if a bucket has fewer than 3 total */
      const notDone = inB.filter(p => !done.includes(p.id));
      const doneOnes = inB.filter(p => done.includes(p.id));
      const preview = [...notDone, ...doneOnes].slice(0, 3);
      const miniHTML = preview.map((p, i) => `<span class="mini-card mc${i + 1}">${p.text}</span>`).join("");
      return `<div class="bucket ${TIER_OF(v)} ${left === 0 ? 'cleared' : ''}"
                   tabindex="0" onclick="openBucket(${v})" onkeydown="if(event.key==='Enter')openBucket(${v})">
        <span class="fill" style="width:${d / inB.length * 100}%"></span>
        <div class="motion">
          <div class="pt-chip"><span class="val">${v}</span><span class="unit">Points</span></div>
          <div class="mini-stack">${miniHTML}</div>
          <span class="avail ${left === 1 ? 'scarce' : ''}">${left ? left + " open" : "all done"}</span>
        </div>
      </div>`;
    }).join("") + `</div>` + feedBlock;
    stagger(pane.querySelectorAll('.bucket'));
    newUid = null;
    return;
  }

  const list = view.bucket === "all" ? PROMPTS : PROMPTS.filter(p => p.pts === view.bucket);
  const sorted = [...list].sort((a,b) => (done.includes(a.id) - done.includes(b.id)) || a.pts - b.pts);
  title.innerHTML = `<button class="back-btn" onclick="backToBuckets()">‹ All points</button>`;
  count.innerHTML = view.bucket === "all"
    ? `<span>All 33</span>`
    : `<span>${view.bucket} pts · ${list.filter(p => !done.includes(p.id)).length} open</span>`;
  pane.innerHTML = `<div class="card-list">` + sorted.map(p => {
    const isDone = done.includes(p.id);
    return `<div class="pcard ${isDone ? 'done' : ''}" tabindex="0"
                 onclick="openCard('${p.id}')" onkeydown="if(event.key==='Enter')openCard('${p.id}')">
      <div class="motion">
        <span class="pts">${p.pts}</span>
        <div style="flex:1; min-width:0">
          <div class="text">${p.text}</div>
          <div class="meta">${GLYPH[p.proof]} ${PLABEL[p.proof]} · Row ${p.id.slice(1)}${p.flag ? ' · ⚑ TBC' : ''}</div>
        </div>
        ${isDone ? '<span class="tick">✓</span>' : ''}
      </div>
    </div>`;
  }).join("") + `</div>` + feedBlock;
  stagger(pane.querySelectorAll('.pcard'));
  newUid = null;
}

function stagger(nodes){
  nodes.forEach((n,i) => {
    const m = n.querySelector('.motion') || n;
    m.classList.add('anim');
    /* entry delay moved off the inline `animation-delay` and onto a
       custom property, because the idle state adds a second
       animation and a bare inline delay would apply to both. */
    m.style.setProperty('--d', Math.min(i*24, 280) + 'ms');
    /* Own clock per card. The negative offset matters: it starts each
       card mid-cycle, so after a re-render they are already scattered
       instead of all counting down from zero together. */
    m.style.setProperty('--tw', (6.5 + Math.random()*6).toFixed(2) + 's');
    m.style.setProperty('--td', (-Math.random()*12).toFixed(2) + 's');
  });
  /* held until the entry animation has finished, so switching the
     `animation` shorthand can't clip the rise-in */
  clearTimeout(stagger._t);
  stagger._t = setTimeout(() => nodes.forEach(n => { (n.querySelector('.motion') || n).classList.add('idle'); }), 720);
}

setInterval(() => {
  if (!SHOW_PLACEHOLDERS || phase !== "live" || incomingIdx >= INCOMING.length) return;
  live.unshift(INCOMING[incomingIdx]);
  newUid = INCOMING[incomingIdx].uid;
  incomingIdx++;
  render();
}, 14000);

/* ============================================================
   SESSION PERSISTENCE — Connie's back-button note

   This is a stand-in for real login, not a replacement for it.
   Real multi-device persistence (resuming on a different phone,
   or after the browser's data is cleared) still needs the
   login + backend from the build audit. What this DOES fix:
   the everyday case she hit — back button, accidental exit, or
   a reload on the SAME phone/browser — no longer clears
   progress. Uploaded files can't survive a reload (the browser
   discards the actual bytes), so a resumed session shows the
   prompt as complete but the live-feed thumbnail reverts to a
   placeholder until real server storage exists.
   ============================================================ */
const SAVE_KEY = "wtfu_session_v10";

function saveProgress(){
  try {
    const slim = Object.fromEntries(ROUND_IDS.map(r => [r, {done: rounds[r].done}]));
    localStorage.setItem(SAVE_KEY, JSON.stringify(slim));
  } catch(e){ /* storage unavailable — fails silently, nothing to resume */ }
}

function loadProgress(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const slim = JSON.parse(raw);
    ROUND_IDS.forEach(r => { if (slim[r] && Array.isArray(slim[r].done)) rounds[r].done = slim[r].done; });
  } catch(e){ /* corrupt or unavailable — start clean rather than crash */ }
}

function resetDemo(){
  myLastSubmissionAt = null;
  ROUND_IDS.forEach(r => { rounds[r].done = []; rounds[r].feed = []; });
  try { localStorage.removeItem(SAVE_KEY); } catch(e){}
  simMinutes = 12*60 + 5; simSeconds = 0;
  incomingIdx = 0; live = SHOW_PLACEHOLDERS ? [...MOCK_FEED] : [];
  view = { mode:"buckets", bucket:null };
  const st = eventState(simMinutes); phase = st.phase; activeRound = st.round;
  document.body.dataset.round = activeRound;
  render(); tickClock(); toast("Demo reset");
}

/* ---------- follow-gate landing screen ----------
   Shown once before the game, per Connie's brainstorm: a chance
   to follow before playing, since several prompts assume it.
   Handles below are placeholders — swap for the real ones. */
const SOCIALS = [
  { label:"Instagram", handle:"@connieatwakethefup", url:"https://instagram.com/connieatwakethefup" },
  { label:"TikTok",    handle:"@wakethef...up", url:"https://tiktok.com/@wakethef...up" }
];
const GATE_KEY  = "wtfu_followgate_seen_v10";
const ENTRY_KEY = "wtfu_entry_seen_v13";
const ENTRY_NAME_KEY = "wtfu_entry_name_v13";

/* ---------- entry gate: first screen, asks who's playing ----------
   Matches the original blueprint's 01-entry/02-login step (name +
   email OR phone, no password). Shown once per browser; runs
   before the follow-gate. Storage here is the same browser-only
   stand-in noted elsewhere in the build — real login still needs
   the backend from the build audit. */
function buildEntryGate(){
  const wrap = document.createElement('div');
  wrap.className = 'gate';
  wrap.id = 'entryGate';
  wrap.innerHTML = `
    <div class="gate-card">
      <div class="gate-mark"><img src="${LOGO_SRC}" alt="Wake The F Up"></div>
      <h2>Join the Hunt</h2>
      <p>Quick intro so winners can be reached at the booth — takes five seconds.</p>
      <div class="gate-form">
        <div class="gate-row">
          <input class="gate-input" id="entryFirst" placeholder="First name" autocomplete="given-name">
          <input class="gate-input" id="entryLast" placeholder="Last name (optional)" autocomplete="family-name">
        </div>
        <input class="gate-input" id="entryEmail" placeholder="Email (optional)" type="email" autocomplete="email">
        <input class="gate-input" id="entryPhone" placeholder="Phone (optional)" type="tel" autocomplete="tel">
      </div>
      <button class="action-btn" id="entryContinue">Join the Hunt</button>
    </div>`;
  document.body.appendChild(wrap);

  ["entryFirst","entryLast","entryEmail","entryPhone"].forEach(id =>
    document.getElementById(id).addEventListener("input", e => e.target.classList.remove("err")));

  document.getElementById("entryContinue").onclick = () => {
    const first = document.getElementById("entryFirst");
    const last  = document.getElementById("entryLast");
    const email = document.getElementById("entryEmail");
    const phone = document.getElementById("entryPhone");
    if (!first.value.trim()) {
      first.classList.add("err");
      haptic(30); toast("Just your first name and you're in");
      return;
    }
    haptic(10);
    try {
      localStorage.setItem(ENTRY_KEY, "1");
      localStorage.setItem(ENTRY_NAME_KEY, (first.value.trim() + " " + last.value.trim()).trim());
    } catch(e){}
    wrap.classList.add("closing");
    setTimeout(() => { wrap.remove(); maybeShowAvatarGate(); }, 300);
  };
}

const AVATAR_SEEN_KEY = "wtfu_avatar_seen_v22";
let pendingAvatar = null;
let pendingAvatarFile = null;

function maybeShowAvatarGate(){
  let seen = false;
  try { seen = !!localStorage.getItem(AVATAR_SEEN_KEY); } catch(e){}
  /* a photo avatar's bytes never survive a reload (loadAvatar drops
     them on purpose), so "seen" alone isn't enough — without this,
     someone who picked a photo once would never see the gate again
     and would be stuck on the fallback icon forever */
  if (!seen || !myAvatar) buildAvatarGate(); else maybeShowFollowGate();
}

function buildAvatarGate(){
  const wrap = document.createElement('div');
  wrap.className = 'gate';
  wrap.id = 'avatarGate';

  const grid = SHAPE_IDS.map(shape => AVATAR_COLORS.map(col => {
    const taken = SHOW_PLACEHOLDERS && Object.values(MOCK_AVATARS).some(a => a.shape === shape && a.color === col.id);
    const id = shape + "-" + col.id;
    return `<button type="button" class="icon-token ${taken ? 'taken' : ''}" data-id="${id}"
              ${taken ? 'disabled' : `onclick="pickAvatarIcon('${shape}','${col.id}')"`}>
              ${avatarSVG(shape, col.hex, 24)}
            </button>`;
  }).join("")).join("");

  wrap.innerHTML = `
    <div class="gate-card">
      <div class="gate-card-scroll">
        <div class="gate-mark"><img src="${LOGO_SRC}" alt="Wake The F Up"></div>
        <h2>Pick your avatar</h2>
        <p>Upload a photo for your profile, or pick an icon instead — grayed-out ones are already taken.</p>
        <div class="avatar-photo-row">
          <button type="button" class="gate-btn" id="avatarPhotoBtn">
            <span>Upload a photo</span><span class="gate-handle" id="avatarPhotoStatus">recommended</span>
          </button>
          <input type="file" id="avatarPhotoInput" accept="image/*" style="display:none">
        </div>
        <div class="icon-grid" id="iconGrid">${grid}</div>
      </div>
      <div class="gate-card-actions">
        <button class="action-btn" id="avatarContinue" disabled>Pick one to continue</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);

  document.getElementById('avatarPhotoBtn').onclick = () => document.getElementById('avatarPhotoInput').click();
  document.getElementById('avatarPhotoInput').onchange = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    pendingAvatarFile = f;
    pendingAvatar = { type:"photo", src:URL.createObjectURL(f) };
    document.querySelectorAll('#iconGrid .icon-token').forEach(b => b.classList.remove('picked'));
    document.getElementById('avatarPhotoStatus').textContent = "added \u2713";
    const btn = document.getElementById('avatarContinue');
    btn.disabled = false; btn.textContent = "Continue";
    haptic(10);
  };

  /* server-side taken check, layered on top of the fixed demo
     combos above \u2014 so two real players in the same room can't
     collide, without waiting on the network before showing the grid */
  apiFetchTakenAvatars().then(taken => {
    taken.forEach(av => {
      if (av.startsWith("photo:")) return;
      const btn = document.querySelector('#iconGrid .icon-token[data-id="' + av.replace(":", "-") + '"]');
      if (btn && !btn.disabled) {
        btn.disabled = true;
        btn.classList.add('taken');
        btn.removeAttribute('onclick');
      }
    });
  });

  document.getElementById('avatarContinue').onclick = async () => {
    if (!pendingAvatar) return;
    haptic(10);
    const btn = document.getElementById('avatarContinue');
    const prevLabel = btn.textContent;
    btn.disabled = true; btn.textContent = "Joining\u2026";
    /* already registered (e.g. the gate re-opened only because a
       photo avatar's bytes didn't survive a reload) \u2014 this is just
       a local re-pick, registering again would create a duplicate
       player and orphan their existing submissions */
    if (myPlayerId) {
      saveAvatar(pendingAvatar);
      try { localStorage.setItem(AVATAR_SEEN_KEY, "1"); } catch(e){}
      render();
      wrap.classList.add('closing');
      setTimeout(() => { wrap.remove(); maybeShowFollowGate(); }, 300);
      return;
    }
    try {
      const avatarStr = pendingAvatar.type === "photo"
        ? "photo:" + (await apiUploadFile(pendingAvatarFile)).key
        : encodeAvatar(pendingAvatar);
      const name = (localStorage.getItem(ENTRY_NAME_KEY) || "Player").trim() || "Player";
      const player = await apiRegisterPlayer(name, avatarStr);
      myPlayerId = player.id;
      try { localStorage.setItem(PLAYER_ID_KEY, myPlayerId); } catch(e){}
    } catch(err){
      if (String(err.message).indexOf("register_failed_409") === 0) {
        toast("That avatar's already taken by someone else here \u2014 pick a different one");
        btn.disabled = false; btn.textContent = prevLabel;
        return;
      }
      toast("Couldn't reach the server \u2014 playing in offline mode");
    }
    saveAvatar(pendingAvatar);
    try { localStorage.setItem(AVATAR_SEEN_KEY, "1"); } catch(e){}
    render();
    wrap.classList.add('closing');
    setTimeout(() => { wrap.remove(); maybeShowFollowGate(); }, 300);
  };
}

function pickAvatarIcon(shape, color){
  haptic(8);
  pendingAvatar = { type:"icon", shape, color };
  document.getElementById('avatarPhotoStatus').textContent = "recommended";
  document.querySelectorAll('#iconGrid .icon-token').forEach(b =>
    b.classList.toggle('picked', b.dataset.id === shape + "-" + color));
  const btn = document.getElementById('avatarContinue');
  btn.disabled = false; btn.textContent = "Continue";
}

function maybeShowFollowGate(){
  let gateSeen = false;
  try { gateSeen = !!localStorage.getItem(GATE_KEY); } catch(e){}
  if (!gateSeen) buildFollowGate();
}

function buildFollowGate(){
  const wrap = document.createElement('div');
  wrap.className = 'gate';
  wrap.id = 'followGate';
  wrap.innerHTML = `
    <div class="gate-card">
      <div class="gate-mark"><img src="${LOGO_SRC}" alt="Wake The F Up"></div>
      <h2>Before you jump in —</h2>
      <p>A few challenges ask you to tag or follow us. Get that out of the way now so you're ready when it counts.</p>
      <div class="gate-socials">
        ${SOCIALS.map(s => `<a href="${s.url}" target="_blank" rel="noopener" class="gate-btn" onclick="haptic(8)">
          <span>Follow on ${s.label}</span><span class="gate-handle">${s.handle}</span></a>`).join("")}
      </div>
      <button class="action-btn" id="gateContinue">I'm following — let's play</button>
    </div>`;
  document.body.appendChild(wrap);
  document.getElementById('gateContinue').onclick = () => {
    haptic(10);
    try { localStorage.setItem(GATE_KEY, "1"); } catch(e){}
    wrap.classList.add('closing');
    setTimeout(() => wrap.remove(), 300);
  };
}

(function boot(){
  document.getElementById('headerLogo').src = LOGO_SRC;
  loadProgress();
  loadAvatar();
  const st = eventState(currentClockReading().mins);
  phase = st.phase; activeRound = st.round;
  document.body.dataset.round = activeRound;
  render(); tickClock();
  setInterval(tickClock, 1000);

  refreshRealLeaderboard(activeRound);
  setInterval(() => refreshRealLeaderboard(activeRound), 10000);
  refreshRealFeed(activeRound);
  setInterval(() => refreshRealFeed(activeRound), 10000);
  refreshOverallLeaderboard();
  setInterval(refreshOverallLeaderboard, 10000);

  let entrySeen = false;
  try { entrySeen = !!localStorage.getItem(ENTRY_KEY); } catch(e){}
  if (!entrySeen) buildEntryGate();
  else maybeShowAvatarGate();
})();
</script>
